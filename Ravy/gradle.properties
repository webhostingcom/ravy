# Memory tuning for low-RAM / phone-based builds (e.g. CodeAssist).
# If your device has plenty of free RAM, raise -Xmx to 2048m. If the build is
# still killed as "out of memory", LOWER these (e.g. 1024m) — on a phone the
# OS can kill the whole build process when total RAM runs short, regardless
# of the JVM limit.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=false
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
